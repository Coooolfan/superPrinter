services:
  mysql:
    image: mysql:8.0
    container_name: superprinter-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: superprinter
      MYSQL_USER: superprinter
      MYSQL_PASSWORD: superprinter
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped

  redis:
    image: redis:7.0
    container_name: superprinter-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: superprinter-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: superprinter
      RABBITMQ_DEFAULT_PASS: superprinter
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
