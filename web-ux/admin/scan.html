<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扫码验证 - 超级打印</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .ios-status-bar {
            height: 44px;
            background: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            color: white;
        }
        .ios-nav-bar {
            height: 83px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e5e5e5;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .scan-area {
            width: 280px;
            height: 280px;
            position: relative;
            margin: 0 auto;
        }
        .scan-frame {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 2px solid #007AFF;
            border-radius: 16px;
        }
        .scan-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: #007AFF;
            animation: scan 2s linear infinite;
        }
        @keyframes scan {
            0% {
                top: 0;
            }
            100% {
                top: 100%;
            }
        }
        .scan-corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid #007AFF;
        }
        .scan-corner-tl {
            top: -2px;
            left: -2px;
            border-right: 0;
            border-bottom: 0;
            border-top-left-radius: 8px;
        }
        .scan-corner-tr {
            top: -2px;
            right: -2px;
            border-left: 0;
            border-bottom: 0;
            border-top-right-radius: 8px;
        }
        .scan-corner-bl {
            bottom: -2px;
            left: -2px;
            border-right: 0;
            border-top: 0;
            border-bottom-left-radius: 8px;
        }
        .scan-corner-br {
            bottom: -2px;
            right: -2px;
            border-left: 0;
            border-top: 0;
            border-bottom-right-radius: 8px;
        }
        .history-card {
            background: white;
            border-radius: 16px;
            margin-bottom: 16px;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- iOS 状态栏 -->
    <div class="ios-status-bar">
        <div class="flex items-center">
            <i class="fas fa-signal"></i>
            <span class="ml-1">中国移动</span>
        </div>
        <div>9:41</div>
        <div class="flex items-center">
            <i class="fas fa-battery-full"></i>
        </div>
    </div>

    <!-- 导航栏 -->
    <div class="ios-nav-bar">
        <div class="flex items-end justify-between px-4 pb-3">
            <div class="flex items-center">
                <button class="text-blue-500 mr-3">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <h1 class="text-2xl font-bold">扫码验证</h1>
            </div>
            <button class="text-blue-500">
                <i class="fas fa-cog text-xl"></i>
            </button>
        </div>
    </div>

    <!-- 主要内容 -->
    <main class="px-4 pb-8">
        <!-- 扫描区域 -->
        <div class="mt-8 mb-12">
            <div class="scan-area">
                <div class="scan-frame">
                    <div class="scan-line"></div>
                    <div class="scan-corner scan-corner-tl"></div>
                    <div class="scan-corner scan-corner-tr"></div>
                    <div class="scan-corner scan-corner-bl"></div>
                    <div class="scan-corner scan-corner-br"></div>
                </div>
                <video class="w-full h-full object-cover rounded-2xl"></video>
            </div>
            <p class="text-center text-gray-500 mt-4">
                将取件码对准扫描框
            </p>
        </div>

        <!-- 手动输入 -->
        <div class="bg-white rounded-xl p-4 mb-8">
            <div class="flex items-center space-x-2">
                <input type="text" 
                       placeholder="手动输入取件码" 
                       class="flex-1 bg-gray-50 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button class="bg-blue-500 text-white px-4 py-2 rounded-lg text-sm">
                    验证
                </button>
            </div>
        </div>

        <!-- 最近验证 -->
        <div>
            <h2 class="text-lg font-semibold mb-4">最近验证</h2>
            <div class="space-y-4">
                <!-- 验证记录1 -->
                <div class="history-card">
                    <div class="p-4">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <h3 class="font-medium">项目报告.pdf</h3>
                                <p class="text-sm text-gray-500">订单号：SP24032001</p>
                            </div>
                            <span class="text-green-500 text-sm">验证成功</span>
                        </div>
                        <div class="text-xs text-gray-500">
                            2024-03-20 15:30:25
                        </div>
                    </div>
                </div>

                <!-- 验证记录2 -->
                <div class="history-card">
                    <div class="p-4">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <h3 class="font-medium">会议记录.docx</h3>
                                <p class="text-sm text-gray-500">订单号：SP24031901</p>
                            </div>
                            <span class="text-green-500 text-sm">验证成功</span>
                        </div>
                        <div class="text-xs text-gray-500">
                            2024-03-19 16:45:12
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 底部提示 -->
    <div class="fixed bottom-8 left-6 right-6">
        <div class="bg-blue-50 rounded-xl p-4">
            <div class="flex items-start">
                <i class="fas fa-lightbulb text-blue-500 text-xl mt-1 mr-3"></i>
                <div class="flex-1">
                    <h3 class="text-sm font-medium text-blue-900">小贴士</h3>
                    <p class="text-xs text-blue-700 mt-1">
                        如果无法扫描，可以尝试：
                        1. 调整取件码与摄像头的距离
                        2. 确保光线充足
                        3. 保持取件码完整清晰
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
