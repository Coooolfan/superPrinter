<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - 超级打印</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .ios-status-bar {
            height: 44px;
            background: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            color: white;
        }
        .ios-nav-bar {
            height: 83px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e5e5e5;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .input-style {
            background: rgba(118, 118, 128, 0.12);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 17px;
            line-height: 22px;
            width: 100%;
            border: none;
            margin-bottom: 16px;
        }
        .btn-primary {
            background: #007AFF;
            border-radius: 12px;
            padding: 16px;
            color: white;
            font-weight: 600;
            width: 100%;
            text-align: center;
            margin-top: 24px;
        }
    </style>
</head>
<body class="bg-white">
    <!-- iOS 状态栏 -->
    <div class="ios-status-bar">
        <div class="flex items-center">
            <i class="fas fa-signal"></i>
            <span class="ml-1">中国移动</span>
        </div>
        <div>9:41</div>
        <div class="flex items-center">
            <i class="fas fa-battery-full"></i>
        </div>
    </div>

    <!-- 导航栏 -->
    <div class="ios-nav-bar flex items-end px-4 pb-3">
        <h1 class="text-2xl font-bold">管理员登录</h1>
    </div>

    <!-- 主要内容 -->
    <main class="px-6 pt-8">
        <div class="mb-12">
            <div class="w-24 h-24 bg-blue-500 rounded-2xl shadow-lg mx-auto flex items-center justify-center">
                <i class="fas fa-print text-white text-4xl"></i>
            </div>
            <h2 class="text-center text-xl font-semibold mt-4">超级打印管理系统</h2>
        </div>

        <form class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">管理员账号</label>
                <input type="text" placeholder="请输入管理员账号" class="input-style" />
            </div>
            <div class="relative">
                <label class="block text-sm font-medium text-gray-700 mb-2">密码</label>
                <input type="password" placeholder="请输入密码" class="input-style" />
            </div>
            
            <div class="flex justify-between text-sm">
                <label class="flex items-center">
                    <input type="checkbox" class="mr-2 h-4 w-4 rounded border-gray-300 text-blue-600">
                    <span class="text-gray-600">记住我</span>
                </label>
                <a href="#" class="text-blue-600">忘记密码？</a>
            </div>

            <button type="submit" class="btn-primary">
                登录
            </button>

            <div class="mt-8 text-center text-sm text-gray-500">
                <p>仅限管理员访问</p>
                <p class="mt-1">如需申请管理员权限，请联系系统管理员</p>
            </div>
        </form>

        <!-- 安全提示 -->
        <div class="fixed bottom-8 left-6 right-6">
            <div class="bg-gray-50 rounded-xl p-4 flex items-center">
                <i class="fas fa-shield-alt text-gray-400 text-xl mr-3"></i>
                <div class="flex-1">
                    <h3 class="text-sm font-medium">安全登录提醒</h3>
                    <p class="text-xs text-gray-500 mt-1">请确保在安全环境下登录管理系统</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
