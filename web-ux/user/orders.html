<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单列表 - 超级打印</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .ios-status-bar {
            height: 44px;
            background: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            color: white;
        }
        .ios-nav-bar {
            height: 83px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e5e5e5;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .ios-tab-bar {
            height: 83px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid #e5e5e5;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }
        .order-card {
            background: white;
            border-radius: 16px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        .status-badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-pending {
            background: #FEF3C7;
            color: #D97706;
        }
        .status-printing {
            background: #DBEAFE;
            color: #2563EB;
        }
        .status-completed {
            background: #D1FAE5;
            color: #059669;
        }
        .tab-button {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            transition: all 0.2s;
        }
        .tab-button.active {
            background: #007AFF;
            color: white;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- iOS 状态栏 -->
    <div class="ios-status-bar">
        <div class="flex items-center">
            <i class="fas fa-signal"></i>
            <span class="ml-1">中国移动</span>
        </div>
        <div>9:41</div>
        <div class="flex items-center">
            <i class="fas fa-battery-full"></i>
        </div>
    </div>

    <!-- 导航栏 -->
    <div class="ios-nav-bar">
        <div class="flex items-end justify-between px-4 pb-3">
            <h1 class="text-2xl font-bold">我的订单</h1>
            <button class="text-blue-500">
                <i class="fas fa-search text-xl"></i>
            </button>
        </div>
    </div>

    <!-- 订单状态标签 -->
    <div class="px-4 py-3 flex space-x-2 overflow-x-auto">
        <button class="tab-button active">全部</button>
        <button class="tab-button">待打印</button>
        <button class="tab-button">打印中</button>
        <button class="tab-button">待取件</button>
        <button class="tab-button">已完成</button>
    </div>

    <!-- 主要内容 -->
    <main class="px-4 pb-24">
        <!-- 订单列表 -->
        <div class="space-y-4">
            <!-- 订单1 -->
            <div class="order-card">
                <div class="p-4 border-b border-gray-100">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <h3 class="font-medium">项目报告.pdf</h3>
                            <p class="text-sm text-gray-500">订单号：SP24032001</p>
                        </div>
                        <span class="status-badge status-pending">待打印</span>
                    </div>
                    <div class="flex items-center text-sm text-gray-500">
                        <span>8页</span>
                        <span class="mx-2">·</span>
                        <span>A4</span>
                        <span class="mx-2">·</span>
                        <span>黑白双面</span>
                    </div>
                </div>
                <div class="p-4 flex items-center justify-between bg-gray-50">
                    <div class="text-gray-500">
                        <span class="text-sm">费用：</span>
                        <span class="text-lg font-medium text-gray-900">¥2.50</span>
                    </div>
                    <button class="bg-blue-500 text-white px-6 py-2 rounded-full text-sm">
                        查看详情
                    </button>
                </div>
            </div>

            <!-- 订单2 -->
            <div class="order-card">
                <div class="p-4 border-b border-gray-100">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <h3 class="font-medium">会议记录.docx</h3>
                            <p class="text-sm text-gray-500">订单号：SP24031901</p>
                        </div>
                        <span class="status-badge status-printing">打印中</span>
                    </div>
                    <div class="flex items-center text-sm text-gray-500">
                        <span>12页</span>
                        <span class="mx-2">·</span>
                        <span>A4</span>
                        <span class="mx-2">·</span>
                        <span>彩色单面</span>
                    </div>
                </div>
                <div class="p-4 flex items-center justify-between bg-gray-50">
                    <div class="text-gray-500">
                        <span class="text-sm">费用：</span>
                        <span class="text-lg font-medium text-gray-900">¥12.00</span>
                    </div>
                    <button class="bg-blue-500 text-white px-6 py-2 rounded-full text-sm">
                        查看详情
                    </button>
                </div>
            </div>

            <!-- 订单3 -->
            <div class="order-card">
                <div class="p-4 border-b border-gray-100">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <h3 class="font-medium">照片打印.zip</h3>
                            <p class="text-sm text-gray-500">订单号：SP24031801</p>
                        </div>
                        <span class="status-badge status-completed">已完成</span>
                    </div>
                    <div class="flex items-center text-sm text-gray-500">
                        <span>6张</span>
                        <span class="mx-2">·</span>
                        <span>6寸</span>
                        <span class="mx-2">·</span>
                        <span>高清相纸</span>
                    </div>
                </div>
                <div class="p-4 flex items-center justify-between bg-gray-50">
                    <div class="text-gray-500">
                        <span class="text-sm">费用：</span>
                        <span class="text-lg font-medium text-gray-900">¥18.00</span>
                    </div>
                    <button class="bg-gray-200 text-gray-600 px-6 py-2 rounded-full text-sm">
                        再次打印
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- 底部标签栏 -->
    <div class="ios-tab-bar grid grid-cols-4 items-center px-6">
        <a href="#" class="flex flex-col items-center">
            <i class="fas fa-home text-gray-400 text-xl"></i>
            <span class="text-xs mt-1 text-gray-400">首页</span>
        </a>
        <a href="#" class="flex flex-col items-center">
            <i class="fas fa-file-alt text-blue-500 text-xl"></i>
            <span class="text-xs mt-1 text-blue-500">订单</span>
        </a>
        <a href="#" class="flex flex-col items-center">
            <i class="fas fa-bell text-gray-400 text-xl"></i>
            <span class="text-xs mt-1 text-gray-400">通知</span>
        </a>
        <a href="#" class="flex flex-col items-center">
            <i class="fas fa-user text-gray-400 text-xl"></i>
            <span class="text-xs mt-1 text-gray-400">我的</span>
        </a>
    </div>
</body>
</html>
